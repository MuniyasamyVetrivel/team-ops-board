spring:
  application:
    name: team-ops-board
  config:
    # Local secrets live in backend/.env (git-ignored). Real environment variables take precedence.
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${FILE_MAX_SIZE_MB:20}MB
      max-request-size: ${FILE_MAX_SIZE_MB:20}MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      status:
        # The backup check reports WARNING (stale or failed backup): visible to monitoring, but still HTTP 200 so a
        # load balancer keeps the app in service.
        order: DOWN,OUT_OF_SERVICE,WARNING,UP,UNKNOWN
        http-mapping:
          WARNING: 200

app:
  # Business time zone: "due today" and "overdue" are evaluated here, not in the server's or browser's zone.
  time-zone: ${APP_TIME_ZONE:Asia/Kolkata}
  scheduling:
    # Background jobs (daily task reminders). Set APP_SCHEDULING_ENABLED=false to run without them.
    enabled: ${APP_SCHEDULING_ENABLED:true}
  notifications:
    # Daily "due soon" / "overdue" reminders, evaluated in app.time-zone.
    reminder-cron: ${TASK_REMINDER_CRON:0 0 8 * * *}
  marketing:
    # Daily recurring-activity job: creates the current period's occurrences and their tasks (app.time-zone).
    activity-cron: ${MARKETING_ACTIVITY_CRON:0 10 0 * * *}
  celebrations:
    # Daily birthday, work anniversary, important day and event reminders (app.time-zone).
    reminder-cron: ${CELEBRATION_REMINDER_CRON:0 0 8 * * *}
    # Shown on work anniversaries ("5 years at Tritusa").
    company-name: ${COMPANY_NAME:Tritusa}
  recycle-bin:
    # Daily permanent delete of recycle bin items older than the Admin Settings retention (app.time-zone).
    purge-cron: ${RECYCLE_BIN_PURGE_CRON:0 30 2 * * *}
  backup:
    # Nightly encrypted backup of the database and the uploads folder (docs/backup-and-restore.md).
    enabled: ${BACKUP_ENABLED:true}
    cron: ${BACKUP_CRON:0 0 2 * * *}
    # Base64 of 32 random bytes. Without it every backup fails (and the status page says why).
    encryption-key: ${BACKUP_ENCRYPTION_KEY:}
    mysqldump-path: ${MYSQLDUMP_PATH:mysqldump}
    # LOCAL (folder below) or S3 (Amazon S3 / Lightsail object storage).
    target: ${BACKUP_TARGET:LOCAL}
    local:
      path: ${BACKUP_LOCAL_PATH:../team-ops-backups}
    s3:
      bucket: ${BACKUP_S3_BUCKET:}
      prefix: ${BACKUP_S3_PREFIX:backups}
      region: ${BACKUP_S3_REGION:}
      endpoint: ${BACKUP_S3_ENDPOINT:}
      access-key: ${BACKUP_S3_ACCESS_KEY:}
      secret-key: ${BACKUP_S3_SECRET_KEY:}
      path-style: ${BACKUP_S3_PATH_STYLE:false}
    # Optional second copy of every backup: LOCAL or S3, blank for none. Stored, verified and kept the same way.
    secondary:
      target: ${BACKUP_SECONDARY_TARGET:}
      local:
        path: ${BACKUP_SECONDARY_LOCAL_PATH:}
      s3:
        bucket: ${BACKUP_SECONDARY_S3_BUCKET:}
        prefix: ${BACKUP_SECONDARY_S3_PREFIX:backups}
        region: ${BACKUP_SECONDARY_S3_REGION:}
        endpoint: ${BACKUP_SECONDARY_S3_ENDPOINT:}
        access-key: ${BACKUP_SECONDARY_S3_ACCESS_KEY:}
        secret-key: ${BACKUP_SECONDARY_S3_SECRET_KEY:}
        path-style: ${BACKUP_SECONDARY_S3_PATH_STYLE:false}
    keep-daily: ${BACKUP_KEEP_DAILY:30}
    keep-monthly: ${BACKUP_KEEP_MONTHLY:12}
    # The health check and status page flag a problem when the last successful backup is older than this.
    max-age-hours: ${BACKUP_MAX_AGE_HOURS:26}
    work-dir: ${BACKUP_WORK_DIR:}
  storage:
    dir: ${FILE_STORAGE_DIR:./uploads}
    max-file-size-mb: ${FILE_MAX_SIZE_MB:20}
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: team-ops-board
      access-token-ttl: ${JWT_ACCESS_TTL_MINUTES:60}
      refresh-token-ttl: ${JWT_REFRESH_TTL_DAYS:7}
    refresh-cookie:
      name: tob_refresh
      path: /api/auth
      secure: ${REFRESH_COOKIE_SECURE:true}
      same-site: Strict
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    first-name: ${BOOTSTRAP_ADMIN_FIRST_NAME:Admin}
    last-name: ${BOOTSTRAP_ADMIN_LAST_NAME:}
    department-code: ${BOOTSTRAP_ADMIN_DEPARTMENT_CODE:IT}
